<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1424" />
      <stop offset="50%" stop-color="#080b11" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="40%" stop-color="#ea580c" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle metallic border -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2" />

  <!-- Shield Shape -->
  <path d="M96 28 L142 46 C142 98 122 136 96 156 C70 136 50 98 50 46 Z" fill="#131b2e" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round" />

  <!-- Glowing Flame -->
  <g filter="url(#glow)">
    <path d="M96 52 C104 70 118 84 118 102 C118 120 106 132 96 136 C86 132 74 120 74 102 C74 88 84 76 96 52 Z" fill="url(#flameGrad)" />
    <!-- Inner Flame Core -->
    <path d="M96 82 C100 92 106 102 106 112 C106 122 100 128 96 130 C92 128 86 122 86 112 C86 102 92 92 96 82 Z" fill="#ffffff" opacity="0.85" />
  </g>
</svg>
